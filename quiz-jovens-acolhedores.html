<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quiz · Jovens Acolhedores</title>
<style>
:root{--navy:#24406B;--bg:#F3F8F9;--card:#FFFFFF;--text:#24406B;--muted:#4A5A72;--line:#DCE6EA;--org:#FF7747;--yel:#F4D550;--teal:#55B9BF;--ok:#1E9E6A;--okbg:#E4F6EE;--no:#D9472B;--nobg:#FDEBE6;--hero:#24406B;--herotext:#FFFFFF;--onteal:#24406B;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0F1C30;--card:#182B47;--text:#F1F5FA;--muted:#B8C6DA;--line:#2C4366;--okbg:#14382B;--nobg:#42211B;--ok:#5FD9A4;--no:#FF9A82;--hero:#1B3254}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0F1C30;--card:#182B47;--text:#F1F5FA;--muted:#B8C6DA;--line:#2C4366;--okbg:#14382B;--nobg:#42211B;--ok:#5FD9A4;--no:#FF9A82;--hero:#1B3254}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;line-height:1.5;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
.hero{background:var(--hero);color:var(--herotext);border-radius:20px;padding:28px 24px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;background:var(--org)}
.hero:after{content:"";position:absolute;right:60px;bottom:-30px;width:70px;height:70px;border-radius:50%;background:var(--teal)}
.kicker{font-size:12px;font-weight:700;letter-spacing:.15em;color:var(--yel);text-transform:uppercase;margin:0 0 6px;position:relative;z-index:1}
h1{font-size:28px;line-height:1.15;margin:0 0 8px;position:relative;z-index:1;max-width:80%}
.hero p{margin:0;color:#DCE6F2;position:relative;z-index:1;max-width:75%}
.bar{height:10px;background:var(--line);border-radius:99px;margin:20px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--org),var(--yel));transition:width .4s}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:14px;animation:in .3s}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tag{display:inline-block;background:var(--yel);color:#24406B;font-size:12px;font-weight:700;border-radius:99px;padding:3px 12px;margin-bottom:10px}
h2{font-size:20px;line-height:1.3;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--text);border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;font:inherit;cursor:pointer;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--teal);transform:translateX(3px)}
.opt:focus-visible,.btn:focus-visible,textarea:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt:disabled{cursor:default}
.fb{margin-top:6px;border-radius:14px;padding:14px;background:var(--bg);border-left:6px solid var(--teal)}
.fb b{display:block;margin-bottom:4px}
.think{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:var(--muted)}
.think strong{color:var(--org)}
.btn{background:var(--org);color:#fff;border:0;border-radius:99px;padding:13px 26px;font:inherit;font-weight:700;cursor:pointer;margin-top:14px}
.btn:hover{filter:brightness(1.07)}
.btn.alt{background:var(--teal);color:var(--onteal)}
.score{font-size:56px;font-weight:800;color:var(--org);line-height:1;margin:6px 0}
textarea{width:100%;min-height:90px;border:2px solid var(--line);border-radius:14px;padding:12px;font:inherit;background:var(--bg);color:var(--text);resize:vertical}
.pledge{margin-top:14px;background:var(--hero);color:#fff;border-radius:16px;padding:18px;border-left:8px solid var(--yel)}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <p class="kicker">Jovens Acolhedores</p>
    <h1>Quiz: a sua importância no Acolhimento</h1>
    <p>8 perguntas para lembrar o que você aprendeu e perceber o quanto o seu papel faz diferença.</p>
  </div>
  <div class="bar"><i id="pb"></i></div>
  <div class="meta"><span id="pn">Pergunta 1 de 8</span><span id="ps">Acertos: 0</span></div>
  <div id="app"></div>
</div>
<script>
var Q=[
{q:"Quem planeja e realiza as atividades do Acolhimento Inicial?",o:["Somente os professores","Os Jovens Acolhedores, com o apoio do COE","A Diretoria de Ensino","Os pais e responsáveis"],a:1,e:"Os jovens acolhedores elaboram, planejam e executam as atividades. Os adultos orientam e apoiam.",t:"Sem você, o Acolhimento simplesmente não acontece. A condução é sua."},
{q:"Por que o Acolhimento é feito “de jovem para jovem”?",o:["Porque os adultos não têm tempo","Porque a conversa fica mais próxima e quem já viveu a escola explica melhor","Porque é mais barato","Porque os jovens decidem as notas"],a:1,e:"Quem já passou pelo Ensino Integral fala a mesma língua de quem está chegando.",t:"Para um novato, ver alguém parecido com ele dizer “vai dar certo” vale mais do que qualquer discurso."},
{q:"Ao final do Acolhimento Inicial, o que cada novo estudante deve conseguir fazer?",o:["Decorar o regimento da escola","Escrever um primeiro rascunho do seu Projeto de Vida","Escolher todas as eletivas do ano","Substituir o professor por um dia"],a:1,e:"O Acolhimento é a primeira etapa do Projeto de Vida: colocar no papel sonhos e o que fazer para realizá-los.",t:"Você pode ser a pessoa que ajuda alguém a escrever o primeiro sonho dele."},
{q:"Qual é o papel do COE (Coordenador de Organização Escolar)?",o:["Fazer tudo no lugar dos jovens","Orientar, acompanhar e organizar o material produzido","Apenas assinar documentos","Escolher os novos estudantes"],a:1,e:"O COE apoia e acompanha, mas o protagonismo é dos jovens.",t:"Você não está sozinho: tem uma equipe por trás, mas a frente é sua."},
{q:"Quando o Acolhimento deve acontecer?",o:["Só no primeiro dia de aula","Uma vez por ano, em dezembro","No início das aulas e sempre que um novo estudante chegar","Apenas quando a direção pedir"],a:2,e:"Quem entra no meio do ano também merece ser acolhido.",t:"Chegar no meio do ano é ainda mais difícil. Seu acolhimento pode ser a diferença."},
{q:"O que acontece com o que vocês produzem no Varal dos Sonhos e na Atividade da Escada?",o:["É jogado fora ao final do dia","Vira portfólio e ajuda nas aulas de Projeto de Vida, Tutoria e Eletivas","Fica só com os acolhedores","É enviado para a Diretoria de Ensino"],a:1,e:"O material é organizado em portfólios individuais e usado ao longo do ano.",t:"O que você ajuda a criar hoje continua trabalhando pelo colega durante o ano todo."},
{q:"No Acolhimento Diário Temático, quem planeja e desenvolve a ação?",o:["Essencialmente os estudantes, com pesquisa e preparo antes","Só a direção","Uma empresa contratada","Ninguém, é improvisado"],a:0,e:"Os estudantes organizam o momento, recebem as pessoas com bom dia e sorriso e abordam um tema relevante.",t:"Um bom dia sincero na entrada pode mudar o dia inteiro de alguém."},
{q:"Depois de acolher, qual é um passo importante?",o:["Esquecer e seguir em frente","Avaliar com o COE o que deu certo e o que precisa ser ajustado","Cancelar as próximas ações","Cobrar nota dos novatos"],a:1,e:"Apontar pontos positivos e pontos de atenção faz o Acolhimento melhorar a cada ciclo.",t:"Sua opinião importa: é ela que torna o próximo acolhimento ainda melhor."}
];
var i=0,score=0,done=false,app=document.getElementById("app");
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function bar(){document.getElementById("pb").style.width=(i/Q.length*100)+"%";document.getElementById("pn").textContent=i<Q.length?"Pergunta "+(i+1)+" de "+Q.length:"Concluído";document.getElementById("ps").textContent="Acertos: "+score}
function show(){
  bar();
  if(i>=Q.length){return end()}
  var q=Q[i],h='<div class="card"><span class="tag">Pergunta '+(i+1)+'</span><h2>'+esc(q.q)+'</h2>';
  q.o.forEach(function(t,k){h+='<button class="opt" data-k="'+k+'">'+esc(t)+'</button>'});
  h+='<div id="fb"></div></div>';app.innerHTML=h;
  Array.prototype.forEach.call(app.querySelectorAll(".opt"),function(b){b.onclick=function(){pick(+b.dataset.k)}});
}
function pick(k){
  var q=Q[i],bs=app.querySelectorAll(".opt"),right=k===q.a;
  if(right)score++;
  Array.prototype.forEach.call(bs,function(b,n){b.disabled=true;if(n===q.a)b.classList.add("ok");else if(n===k)b.classList.add("no")});
  document.getElementById("fb").innerHTML='<div class="fb"><b>'+(right?"Isso mesmo!":"Quase! A resposta certa está marcada.")+'</b>'+esc(q.e)+'<div class="think"><strong>Pense nisso:</strong> '+esc(q.t)+'</div></div><button class="btn" id="nx">'+(i<Q.length-1?"Próxima":"Ver resultado")+'</button>';
  document.getElementById("ps").textContent="Acertos: "+score;
  var n=document.getElementById("nx");n.focus();n.onclick=function(){i++;show();window.scrollTo({top:0,behavior:"smooth"})};
}
function end(){
  var m=score>=7?"Você entendeu o seu papel e o quanto ele pesa. Está pronto(a) para acolher!":score>=4?"Você está no caminho. Reveja os pontos que errou e converse com o COE.":"Tudo bem! Releia o material com calma e tente de novo. Acolher também se aprende.";
  app.innerHTML='<div class="card" style="text-align:center"><span class="tag">Resultado</span><div class="score">'+score+'/'+Q.length+'</div><h2>'+m+'</h2></div>'+
  '<div class="card"><span class="tag">Reflexão final</span><h2>Qual é a sua importância para quem chega na escola?</h2><p style="color:var(--muted);margin-top:0">Complete com as suas palavras: “Quando eu acolho alguém, eu…”</p><textarea id="ta" aria-label="Sua reflexão" placeholder="Escreva aqui o seu compromisso como acolhedor(a)"></textarea><button class="btn" id="sv">Criar meu compromisso</button><div id="pl"></div></div>'+
  '<div style="text-align:center"><button class="btn alt" id="rs">Refazer o quiz</button></div>';
  document.getElementById("sv").onclick=function(){var v=document.getElementById("ta").value.trim();if(!v){document.getElementById("ta").focus();return}document.getElementById("pl").innerHTML='<div class="pledge"><strong style="color:var(--yel)">Meu compromisso como Jovem Acolhedor(a)</strong><p style="margin:8px 0 0">“'+esc(v)+'”</p></div>'};
  document.getElementById("rs").onclick=function(){i=0;score=0;show();window.scrollTo({top:0,behavior:"smooth"})};
}
show();
</script>
</body>
</html>
